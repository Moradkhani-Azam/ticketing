services:
  app:
    user: "${UID}:${GID}"
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    image: ticketing
    container_name: ticketing
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8080
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ticketing
      - DB_USERNAME=ticketing_user
      - DB_PASSWORD=secret
      - EXTERNAL_API_URL=http://nginx/api/external-service/send
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticketing

  nginx:
    image: nginx:stable-alpine
    container_name: ticketing_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ticketing

  db:
    image: mysql:8.0
    container_name: ticketing_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketing
      MYSQL_USER: ticketing_user
      MYSQL_PASSWORD: secret
    volumes:
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ticketing

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ticketing_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ticketing

  node:
    image: node:22-alpine
    container_name: ticketing_node
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run build && npm run dev -- --host"
    networks:
      - ticketing

  queue:
    user: "${UID}:${GID}"

    build:
      context: .
      dockerfile: ./docker/Dockerfile

    container_name: ticketing_queue

    restart: unless-stopped

    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ticketing
      DB_USERNAME: ticketing_user
      DB_PASSWORD: secret
      EXTERNAL_API_URL: http://nginx/api/external-service/send

    depends_on:
      db:
        condition: service_healthy

      app:
        condition: service_started

    command: supervisord -c /etc/supervisor/supervisord.conf

    networks:
      - ticketing

volumes:
  dbdata:
  node_modules:
  vendor:

networks:
  ticketing:
    driver: bridge